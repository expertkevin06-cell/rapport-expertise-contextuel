<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⚖️ Expert Litiges Auto – K06</title>
<meta name="description" content="Rapports d'expertise pour litiges et pannes automobiles – analyse technique et juridique (vices cachés, conformité, délivrance, dol, obligation de résultat).">
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--gold:#d4af37;--gold2:#f5d97b;--bg:#05070f;--card:rgba(13,27,42,.78);--card2:rgba(27,38,59,.6);--txt:#e8e6df;--mut:#9aa5b1;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--acc:#7dd3fc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden}
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:-2}
#bgOverlay{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 0%,transparent 0%,rgba(5,7,15,.55) 70%,rgba(5,7,15,.85) 100%)}
.hidden{display:none!important}
/* ---------- Écran verrou ---------- */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lockCard{width:100%;max-width:420px;background:var(--card);backdrop-filter:blur(14px);border:1px solid rgba(212,175,55,.35);border-radius:18px;padding:34px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lockCard .logo{font-size:52px}
.lockCard h1{font-size:1.45rem;color:var(--gold2);margin:8px 0 4px;letter-spacing:.5px}
.lockCard p{color:var(--mut);font-size:.9rem;margin-bottom:20px}
/* ---------- Formulaire & UI ---------- */
input,select,textarea,button{font-family:inherit;font-size:1rem}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(5,10,20,.65);color:var(--txt);outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:.82rem;color:var(--mut);margin:12px 0 5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;border:none;cursor:pointer;font-weight:700;background:linear-gradient(135deg,var(--gold),#a8842a);color:#1a1405;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,175,55,.35)}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid rgba(255,255,255,.18)}
.btn.dgr{background:#7f1d1d;color:#fff}
.btn.sm{padding:8px 13px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:wait}
/* ---------- App layout ---------- */
#app{max-width:1060px;margin:0 auto;padding:14px 14px 90px}
header.top{display:flex;align-items:center;gap:12px;padding:10px 4px 14px;flex-wrap:wrap}
header.top .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
header.top .brand img{width:44px;height:44px;border-radius:10px}
header.top h1{font-size:1.15rem;color:var(--gold2)}
header.top .sub{font-size:.72rem;color:var(--mut)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;padding:5px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.15);background:var(--card2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px;-webkit-overflow-scrolling:touch}
nav.tabs button{white-space:nowrap;padding:10px 15px;border-radius:99px;border:1px solid rgba(255,255,255,.12);background:var(--card2);color:var(--mut);cursor:pointer;font-weight:600;font-size:.85rem}
nav.tabs button.on{background:linear-gradient(135deg,var(--gold),#a8842a);color:#1a1405;border-color:transparent}
section.tab{display:none;animation:fade .25s}
section.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card h2{color:var(--gold2);font-size:1.05rem;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card h3{color:var(--acc);font-size:.95rem;margin:14px 0 6px}
.card .desc{color:var(--mut);font-size:.85rem;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.metric{background:rgba(5,10,20,.5);border:1px solid rgba(212,175,55,.2);border-radius:12px;padding:12px;text-align:center}
.metric .v{font-size:1.25rem;font-weight:800;color:var(--gold2)}
.metric .k{font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.alert{border-radius:12px;padding:12px 14px;margin:8px 0;font-size:.88rem;border-left:4px solid}
.alert.ok{background:rgba(52,211,153,.08);border-color:var(--ok)}
.alert.warn{background:rgba(251,191,36,.08);border-color:var(--warn)}
.alert.bad{background:rgba(248,113,113,.08);border-color:var(--bad)}
.alert.info{background:rgba(125,211,252,.08);border-color:var(--acc)}
/* Rapport */
#reportBox{background:rgba(250,248,242,.97);color:#1c2430;border-radius:14px;padding:26px;margin-top:14px;font-family:Georgia,'Times New Roman',serif;line-height:1.65;font-size:.95rem;overflow-wrap:break-word}
#reportBox h1{font-size:1.4rem;color:#1a2740;border-bottom:3px solid var(--gold);padding-bottom:8px;margin:18px 0 12px}
#reportBox h2{font-size:1.15rem;color:#26364f;margin:18px 0 8px;border-left:4px solid var(--gold);padding-left:10px}
#reportBox h3{font-size:1rem;color:#3a4a63;margin:12px 0 6px}
#reportBox h4{font-size:.95rem;color:#4a5a73;margin:10px 0 4px}
#reportBox ul,#reportBox ol{margin:8px 0 8px 22px}
#reportBox li{margin:4px 0}
#reportBox blockquote{border-left:3px solid #b58d1e;background:#faf5e6;padding:8px 12px;margin:10px 0;font-style:italic;color:#5a4d20}
#reportBox hr{border:none;border-top:1px dashed #b9b2a0;margin:16px 0}
#reportBox code{background:#eef1f6;padding:1px 5px;border-radius:4px;font-size:.85em}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(212,175,55,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* Cas list */
.caseCard{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;margin:10px 0;background:var(--card2)}
.caseCard .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.caseCard .ref{color:var(--gold2);font-weight:700}
.small{font-size:.78rem;color:var(--mut)}
iframe.diag{width:100%;height:78vh;border:1px solid rgba(212,175,55,.3);border-radius:14px;background:#fff}
footer{text-align:center;color:var(--mut);font-size:.75rem;padding:20px 10px;line-height:1.6}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#111c2e;border:1px solid var(--gold);color:var(--gold2);padding:12px 20px;border-radius:12px;font-size:.88rem;opacity:0;transition:.35s;z-index:99;max-width:92vw;text-align:center}
#toast.show{transform:translateX(-50%);opacity:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.kbd{background:#111c2e;border:1px solid rgba(255,255,255,.2);padding:2px 7px;border-radius:5px;font-family:monospace;font-size:.85rem;color:var(--gold2)}
@media print{#bg,#bgOverlay,nav.tabs,header.top,.btn,.actions{display:none!important}}
</style>
</head>
